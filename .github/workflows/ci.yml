name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: js (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json "packageManager"; also pinning
      # it here makes the action fail with "Multiple versions of pnpm".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  python:
    name: python (lint + typecheck + test)
    runs-on: ubuntu-latest
    strategy:
      # Report every service instead of cancelling the rest on the
      # first failure.
      fail-fast: false
      matrix:
        service: [api, realtime, discovery, ingestion, scoring]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # No uv.lock in the repo; the default glob (**/uv.lock)
          # matched nothing and failed the step.
          cache-dependency-glob: apps/${{ matrix.service }}/pyproject.toml
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install service deps
        working-directory: apps/${{ matrix.service }}
        run: |
          uv venv --python 3.12 .venv
          # dev group carries testcontainers/psycopg for the DB-backed tests.
          uv pip install --python .venv/bin/python -e . --group dev
          uv pip install --python .venv/bin/python ruff mypy pytest pytest-asyncio httpx
      - name: ruff
        working-directory: apps/${{ matrix.service }}
        run: .venv/bin/ruff check .
      - name: mypy
        working-directory: apps/${{ matrix.service }}
        run: .venv/bin/mypy src
      - name: pytest
        working-directory: apps/${{ matrix.service }}
        run: .venv/bin/pytest

  compose-smoke:
    name: docker-compose smoke (boot + curl /health)
    runs-on: ubuntu-latest
    needs: [js, python]
    steps:
      - uses: actions/checkout@v4
      # Services read ../.env (gitignored); compose fails if it's absent.
      - name: Create empty .env
        run: touch .env
      - name: docker compose up
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for services to become healthy
        run: |
          set -euo pipefail
          for svc in api:8001 realtime:8002 discovery:8003 ingestion:8004 scoring:8005; do
            name="${svc%%:*}"
            port="${svc##*:}"
            echo "waiting on ${name} :${port}"
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:${port}/health" > /dev/null; then
                echo "  ${name} OK"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "  ${name} did not become healthy"
                docker compose -f infra/docker-compose.yml logs "${name}"
                exit 1
              fi
              sleep 2
            done
          done
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
