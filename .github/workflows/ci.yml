name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: js (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  python:
    name: python (lint + typecheck + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, realtime, discovery, ingestion, scoring]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install service deps
        working-directory: apps/${{ matrix.service }}
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e .
          uv pip install --python .venv/bin/python ruff mypy pytest pytest-asyncio httpx
      - name: ruff
        working-directory: apps/${{ matrix.service }}
        run: .venv/bin/ruff check .
      - name: mypy
        working-directory: apps/${{ matrix.service }}
        run: .venv/bin/mypy src
      - name: pytest
        working-directory: apps/${{ matrix.service }}
        run: .venv/bin/pytest

  compose-smoke:
    name: docker-compose smoke (boot + curl /health)
    runs-on: ubuntu-latest
    needs: [js, python]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for services to become healthy
        run: |
          set -euo pipefail
          for svc in api:8001 realtime:8002 discovery:8003 ingestion:8004 scoring:8005; do
            name="${svc%%:*}"
            port="${svc##*:}"
            echo "waiting on ${name} :${port}"
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:${port}/health" > /dev/null; then
                echo "  ${name} OK"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "  ${name} did not become healthy"
                docker compose -f infra/docker-compose.yml logs "${name}"
                exit 1
              fi
              sleep 2
            done
          done
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
