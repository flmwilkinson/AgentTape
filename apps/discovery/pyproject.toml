[project]
name = "agenttape-discovery"
version = "0.0.0"
description = "AgentTape autonomous discovery service. Scans GitHub, HF, MCP, package managers, arXiv, HN."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.2.0",
    "asyncpg>=0.30.0",
    "apscheduler>=3.10.0",
    "feedparser>=6.0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttape_discovery"]
