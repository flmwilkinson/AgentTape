[project]
name = "agenttape-api"
version = "0.0.0"
description = "AgentTape public REST API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # psycopg is alembic's sync driver — required at runtime so the
    # `migrate` one-shot service can apply schema without pulling
    # dev extras. Cheap install (~5 MB binary).
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "redis[hiredis]>=5.2.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    # OpenTelemetry — gracefully no-op when OTEL_EXPORTER_OTLP_ENDPOINT
    # is unset, so local dev pays nothing for these.
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.9.0",
    "psycopg[binary]>=3.2.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttape_api"]
