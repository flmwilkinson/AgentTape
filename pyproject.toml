[project]
name = "agenttape"
version = "0.0.0"
description = "AgentTape Python services workspace root."
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/realtime",
    "apps/discovery",
    "apps/ingestion",
    "apps/scoring",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "ASYNC", "RUF"]
ignore = [
    "E501",
    # House style, not defects:
    "RUF001", "RUF002", "RUF003",  # em dashes / arrows in prose
    "RUF100",  # "noqa: BLE001" markers document intent even with BLE off
    "UP042",   # StrEnum changes str() of the existing enums
    "B008",    # FastAPI Query()/Depends() defaults
    "N806",    # class aliases like TrendReq = _get_pytrends_cls()
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps"]
python_files = ["test_*.py"]
